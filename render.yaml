# Render Blueprint for HexHunt 1.0 — NO DOCKER (native runtimes).
# Deploy via Render → "New +" → "Blueprint" → connect this repo.
#
# Service URLs are auto-derived via fromService → RENDER_EXTERNAL_URL, so no
# *.onrender.com host is hardcoded and nothing URL-related needs manual entry.
# JWT_SECRET / COOKIE_SECRET are auto-generated. The ONLY values you must enter
# in the Blueprint screen are the operator secrets:
#   ADMIN_EMAIL, ADMIN_PASSWORD
#
# NOTE: verify field names against the current Render Blueprint reference before
# applying; Render occasionally renames keys (e.g. env ↔ runtime).

databases:
  - name: hexhunt-db
    databaseName: hexhunt
    user: hexhunt
    plan: free

services:
  # ── Backend API (Fastify + Prisma) ────────────────────────
  - type: web
    name: hexhunt-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run prisma:generate && npm run build && npm run migrate
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # PORT is injected by Render automatically; do not hardcode.
      - key: DATABASE_URL
        fromDatabase:
          name: hexhunt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "28800"
      - key: COOKIE_SECURE
        value: "true"
      # onrender.com subdomains are cross-site → cookie must be SameSite=None.
      - key: COOKIE_SAMESITE
        value: none
      # Auto-derived from the static sites' Render external URLs (CORS allow-list).
      - key: PLAYER_ORIGIN
        fromService:
          name: hexhunt-player
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_ORIGIN
        fromService:
          name: hexhunt-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # This API's own public origin (self-reference) — used to build challenge
      # artifact URLs. No hardcoded host.
      - key: PUBLIC_API_URL
        fromService:
          name: hexhunt-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ARTIFACT_BASE_URL
        fromService:
          name: hexhunt-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Admin credentials — REQUIRED in production (no default). Enter in dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: HexHunt Admin
      - key: EVENT_NAME
        value: HexHunt 1.0
      # Optional tuning (code defaults apply if omitted):
      - key: HIDDEN_LEVEL_DELAY_MINUTES
        value: "30"
      - key: HIDDEN_REWARD
        value: "500"
      - key: HIDDEN_PENALTY
        value: "400"
      - key: SCORING_DECAY_STEP_MINUTES
        value: "15"
      - key: SCORING_DECAY_STEP_PERCENT
        value: "10"
      - key: SCORING_FLOOR_PERCENT
        value: "25"
      - key: SUBMIT_RATE_MAX
        value: "10"
      - key: SUBMIT_RATE_WINDOW_SECONDS
        value: "60"

  # ── Player frontend (static SPA) ──────────────────────────
  - type: web
    name: hexhunt-player
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Build-time API origin, auto-derived from the backend's external URL.
      - key: VITE_API_URL
        fromService:
          name: hexhunt-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Admin dashboard (static SPA) ──────────────────────────
  - type: web
    name: hexhunt-admin
    runtime: static
    rootDir: admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Build-time API origin, auto-derived from the backend's external URL.
      # The admin client derives the WebSocket URL from this (https→wss).
      - key: VITE_API_URL
        fromService:
          name: hexhunt-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
