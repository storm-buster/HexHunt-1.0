<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="doom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="60%" stop-color="#00aa55"/>
      <stop offset="100%" stop-color="#004422"/>
    </radialGradient>
    <radialGradient id="crack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#660011"/>
    </radialGradient>
  </defs>
  <!-- Infinity Stone ring -->
  <circle cx="16" cy="16" r="14" fill="url(#doom)" opacity="0.9"/>
